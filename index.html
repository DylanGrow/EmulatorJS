<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA Web Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 640px;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'gba';

    // Update this to match your exact file name and path
    window.EJS_gameUrl = 'roms/game.gba';

    // If your fork has a local data/ folder, keep this as 'data/'.
    // If not, use the official CDN link below:
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

    window.EJS_startOnLoaded = true;
  </script>
  <!-- Main emulator script loader -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
